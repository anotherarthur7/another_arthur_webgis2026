<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CIM{% endblock %}</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 600px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        nav { background: #333; padding: 10px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .messages { margin-bottom: 20px; }
        .messages ul { list-style: none; padding: 0; }
        .messages li { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .messages .success { background: #d4edda; color: #155724; }
        .messages .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'main:home' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'main:user_map' %}">Map</a>
            <form method="post" action="{% url 'main:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="background: none; border: none; color: white; cursor: pointer; text-decoration: underline;">
                    Logout ({{ user.username }})
                </button>
            </form>
        {% else %}
            <a href="{% url 'main:login' %}">Login</a>
            <a href="{% url 'main:register' %}">Register</a>
        {% endif %}
    </nav>
    <div class="container">
        {% if messages %}
            <div class="messages">
                <ul>
                    {% for message in messages %}
                        <li class="{{ message.tags }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
